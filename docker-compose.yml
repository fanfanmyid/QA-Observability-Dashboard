services:
  backend:
    build:
      context: ./backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ~/.ssh:/root/.ssh:ro
    networks:
      - qa_dashboard_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - qa_dashboard_net
    restart: unless-stopped

networks:
  qa_dashboard_net:
    driver: bridge
